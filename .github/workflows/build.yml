name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} out/HostsGuard.apk \;
          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HostsGuard-APK
          path: out/HostsGuard.apk
          retention-days: 30

      - name: Upload mapping (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/logs/
            app/build/outputs/mapping/
          if-no-files-found: ignore
          retention-days: 7