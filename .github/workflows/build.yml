name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 用 runner 预装的 Gradle，不下载 distribution
      # （services.gradle.org 最近频繁 504）
      - name: Show Gradle version
        run: gradle --version

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        if: success()
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} out/HostsGuard.apk \;
          ls -la out/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HostsGuard-APK
          path: out/HostsGuard.apk
          retention-days: 30